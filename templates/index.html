<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.title }}</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; }
        select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        .ticket { border-left: 5px solid #28a745; }
        .price { font-size: 22px; color: #28a745; font-weight: bold; }
        .buy-btn { display: block; background: #ff9800; color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align:center; color:#007bff;">✈️ AviaSearch</h2>
        <form method="GET">
            <select name="lang" onchange="this.form.submit()">
                <option value="tg" {% if lang=='tg' %}selected{% endif %}>Тоҷикӣ</option>
                <option value="ru" {% if lang=='ru' %}selected{% endif %}>Русский</option>
                <option value="en" {% if lang=='en' %}selected{% endif %}>English</option>
            </select>
            
            <select name="origin">
                <option value="">-- {{ t.from }} --</option>
                {% for city in cities %}
                <option value="{{ city.code }}" {% if request.args.get('origin')==city.code %}selected{% endif %}>{{ city.name }}</option>
                {% endfor %}
            </select>

            <select name="destination">
                <option value="">-- {{ t.to }} --</option>
                {% for city in cities %}
                <option value="{{ city.code }}" {% if request.args.get('destination')==city.code %}selected{% endif %}>{{ city.name }}</option>
                {% endfor %}
            </select>

            <button type="submit">{{ t.search }}</button>
        </form>
    </div>

    {% if error_msg %}<div class="card" style="color:red;">{{ error_msg }}</div>{% endif %}

    {% for f in flights %}
    <div class="card ticket">
        <div class="price">{{ f.price }} {{ currency }}</div>
        <p><b>Парвоз:</b> {{ f.departure_at }}</p>
        <a class="buy-btn" href="https://www.aviasales.com{{ f.link }}?marker=701004" target="_blank">{{ t.buy }}</a>
    </div>
    {% endfor %}
</body>
</html>
