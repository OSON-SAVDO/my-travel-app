<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AviaSearch</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --main: #2ecc71; --bg: #f5f7fa; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; }

        .header { background: linear-gradient(135deg, #2ecc71, #27ae60); padding: 40px 20px 70px 20px; border-radius: 0 0 30px 30px; color: white; text-align: center; }
        
        /* Search Box */
        .search-container { background: white; margin: -45px 20px 20px 20px; padding: 20px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .input-group { background: #f1f3f5; padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; align-items: center; }
        .input-group i { color: #95a5a6; margin-right: 15px; width: 20px; }
        select { border: none; background: transparent; width: 100%; font-size: 16px; font-weight: 600; outline: none; }
        
        .btn-search { background: var(--main); color: white; border: none; width: 100%; padding: 18px; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; }

        /* Tickets (сонияи 0:32) */
        .ticket-card { background: white; margin: 15px; padding: 20px; border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .price { font-size: 24px; font-weight: 800; color: #2ecc71; margin-bottom: 15px; }
        .route-info { display: flex; justify-content: space-between; align-items: center; }
        .time { font-size: 20px; font-weight: bold; }
        .city { font-size: 13px; color: #95a5a6; }
        .path { flex-grow: 1; text-align: center; position: relative; margin: 0 15px; border-top: 2px dashed #eee; margin-top: 10px; }
        .path::after { content: '✈️'; position: absolute; top: -14px; left: 45%; font-size: 14px; background: white; padding: 0 5px; }

        /* Skeleton Loading */
        .skeleton { height: 150px; background: #eee; border-radius: 20px; margin: 15px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0">AviaSearch</h1>
    <p style="opacity:0.8; margin-top:5px;">Чиптаҳои арзон барои шумо</p>
</div>

<div class="search-container">
    <div class="input-group">
        <i class="fas fa-plane-departure"></i>
        <select id="origin">
            <option value="DYU">Душанбе (DYU)</option>
            <option value="LBD">Хуҷанд (LBD)</option>
        </select>
    </div>
    <div class="input-group">
        <i class="fas fa-plane-arrival"></i>
        <select id="destination">
            <option value="MOW">Москва (MOW)</option>
            <option value="TAS">Тошканд (TAS)</option>
            <option value="IST">Истанбул (IST)</option>
        </select>
    </div>
    <button class="btn-search" onclick="fetchTickets()">Чиптаҳоро ёфтан</button>
</div>

<div id="loader" style="display:none">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
</div>

<div id="results"></div>

<script>
async function fetchTickets() {
    const results = document.getElementById('results');
    const loader = document.getElementById('loader');
    const origin = document.getElementById('origin').value;
    const dest = document.getElementById('destination').value;

    results.innerHTML = '';
    loader.style.display = 'block';

    try {
        const response = await fetch(`/api/search?origin=${origin}&destination=${dest}`);
        const data = await response.json();
        loader.style.display = 'none';

        if(data.success && data.data.length > 0) {
            data.data.forEach(flight => {
                results.innerHTML += `
                    <div class="ticket-card">
                        <div class="price">${flight.price} TJS</div>
                        <div class="route-info">
                            <div><div class="time">08:00</div><div class="city">${flight.origin}</div></div>
                            <div class="path"></div>
                            <div style="text-align:right"><div class="time">12:30</div><div class="city">${flight.destination}</div></div>
                        </div>
                        <div style="margin-top:15px; display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-weight:bold; color:#7f8c8d;">${flight.airline}</span>
                            <a href="https://www.aviasales.com${flight.link}" target="_blank" 
                               style="background:#ff9f43; color:white; padding:10px 20px; border-radius:12px; text-decoration:none; font-weight:bold;">Харидан</a>
                        </div>
                    </div>`;
            });
        } else {
            results.innerHTML = '<p style="text-align:center; color:#95a5a6;">Чипта ёфт нашуд</p>';
        }
    } catch (e) {
        loader.style.display = 'none';
        results.innerHTML = '<p style="text-align:center; color:red;">Хатогии API</p>';
    }
}
</script>
</body>
</html>
