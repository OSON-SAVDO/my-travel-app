<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.title }}</title>
    <style>
        :root { --primary: #00a1ff; --bg: #f5f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .header { background: var(--primary); color: white; padding: 20px; border-radius: 0 0 20px 20px; margin: -15px -15px 20px -15px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; }
        button { background: #ff6d00; color: white; border: none; font-weight: bold; cursor: pointer; }
        .ticket { border-left: 6px solid var(--primary); display: flex; flex-direction: column; }
        .price { font-size: 24px; color: #2ecc71; font-weight: bold; }
        .buy-btn { background: var(--primary); text-decoration: none; color: white; text-align: center; padding: 10px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header"><h1>✈️ AviaSearch</h1></div>

    <div class="card">
        <form method="GET">
            <div style="display: flex; gap: 10px;">
                <select name="lang" onchange="this.form.submit()">
                    <option value="tg" {% if lang=='tg' %}selected{% endif %}>TJ</option>
                    <option value="ru" {% if lang=='ru' %}selected{% endif %}>RU</option>
                    <option value="en" {% if lang=='en' %}selected{% endif %}>EN</option>
                </select>
                <select name="currency" onchange="this.form.submit()">
                    <option value="TJS" {% if currency=='TJS' %}selected{% endif %}>TJS</option>
                    <option value="RUB" {% if currency=='RUB' %}selected{% endif %}>RUB</option>
                    <option value="USD" {% if currency=='USD' %}selected{% endif %}>USD</option>
                </select>
            </div>
            <input type="text" name="origin" placeholder="{{ t.from }} (DYU)" value="{{ request.args.get('origin','') }}">
            <input type="text" name="destination" placeholder="{{ t.to }} (MOW)" value="{{ request.args.get('destination','') }}">
            <button type="submit">{{ t.search }}</button>
        </form>
    </div>

    {% for f in flights %}
    <div class="card ticket">
        <div class="price">{{ f.price }} {{ currency }}</div>
        <div style="margin: 10px 0;">
            <b>{{ t.airline }}:</b> {{ f.airline }} <br>
            <b>{{ t.date }}:</b> {{ f.departure_at }}
        </div>
        <a class="buy-btn" href="https://www.aviasales.com{{ f.link }}?marker=701004" target="_blank">{{ t.buy }}</a>
    </div>
    {% endfor %}
</body>
</html>
